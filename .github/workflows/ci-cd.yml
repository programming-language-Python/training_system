# .github/workflows/ci-cd.yml
name: CI/CD

on:
  push:
    branches: [ dev,]   # <-- меняйте под свои ветки
#  pull_request:
#    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:                          # если используете PostgreSQL
        image: postgres:13
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11.1
      uses: actions/setup-python@v5
      with:
        python-version: 3.11.1

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/requirements.txt

    - name: Apply migrations
      env:
        DJANGO_SETTINGS_MODULE: config.settings   # <‑ ваш тестовый settings
        DATABASE_URL: postgres://user:pass@localhost:5432/test_db
      run: |
        python src/manage.py makemigrations --noinput
        python src/manage.py migrate --noinput

    - name: Run tests
      env:
        DJANGO_SETTINGS_MODULE: config.settings
        DATABASE_URL: postgres://user:pass@localhost:5432/test_db
      run: |
        coverage run --source='.' src/manage.py test
        coverage report --omit=*/migrations/*

#    - name: Upload coverage report
