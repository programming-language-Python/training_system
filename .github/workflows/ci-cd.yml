# yaml .github/workflows/ci-cd.yml
name: CI/CD

on:
  push:
    branches: [ dev,]   # <-- keep only the branches you actually use

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11.1
      uses: actions/setup-python@v5
      with:
        python-version: 3.11.1

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/requirements.txt

    # ---------- Apply migrations ----------
    - name: Apply migrations
      env:
        DJANGO_SETTINGS_MODULE: config.settings   # <-- test/dev settings
        DJANGO_SECRET_KEY: django1234
        DEBUG: True
        # Use a single DATABASE_URL that matches the service
        DATABASE_URL: postgres://user:pass@localhost:5432/test_db
      run: |
        # No need to start systemd PostgreSQL – the service container is ready
        python src/manage.py makemigrations --noinput
        python src/manage.py migrate --noinput

    # ---------- Optional: Run tests ----------
    # Uncomment and adjust if you want to run tests
