<div class="timer uk-position-relative uk-position-center uk-grid-small uk-child-width-auto" id="timer" uk-grid
     uk-countdown="date: {{ end_passage }}" data-end-passage="{{ end_passage }}">
    <input form="solving-testing-form" type="hidden" id="duration" value="{{ duration }}">
    <div>Оставшееся время</div>
    <div>
        <div class="uk-countdown-hours"></div>
    </div>
    <div>:</div>
    <div>
        <div class="uk-countdown-minutes"></div>
    </div>
    <div>:</div>
    <div>
        <div class="uk-countdown-seconds"></div>
    </div>
</div>
