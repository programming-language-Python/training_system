<ul id="answer-options" name="answer-options">
    <h4>Правильные варианты</h4>
    <ul id="correct-options" class="uk-list uk-list-divider" uk-sortable="handle: .uk-sortable-handle">
    </ul>
    <h4>Неправильные варианты</h4>
    <ul id="incorrect-options" class="uk-list uk-list-divider" uk-sortable="handle: .uk-sortable-handle">
        {% for field in form %}
            {% for foo in field %}
                <li name="answer-option" class="uk-grid-small" uk-grid>
                    <span name="sort-sign" class="uk-width-small uk-sortable-handle" uk-icon="icon: table"></span>
                    <div>{{ foo }}</div>
                </li>
            {% endfor %}
        {% endfor %}

    </ul>
</ul>
