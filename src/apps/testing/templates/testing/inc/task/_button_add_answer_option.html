<form
        id="add-answer-option-form"
        method="get"
        hx-get="{{ task.get_absolute_url }}"
        hx-target="#answer-options"
        hx-swap="innerHTML"
>
    <label for="quantity-answer-options-add">Добавить пустые варианты ответа</label>
    <input class="uk-input uk-width-auto" id="quantity-answer-options-add" name="quantity-answer-options-add"
           type="number" value="1" min="1" max="8">
    <button class="uk-button uk-button-primary" type="submit">Добавить вариант ответа</button>
</form>
